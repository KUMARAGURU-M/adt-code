<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" width="320" height="88">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Oxford Shield -->
  <g transform="translate(20, 20)">
    <path d="M4 2C4 2 4 22 20 38C36 22 36 2 36 2H4Z" fill="#002147"/>
    <!-- Book in the shield -->
    <rect x="10" y="10" width="20" height="14" rx="1.5" fill="#FFFFFF"/>
    <!-- 3 small crowns -->
    <path d="M12 6h2l-1 2zM26 6h2l-1 2zM19 28h2l-1 2z" fill="#F1C40F"/>
    <!-- lines on book -->
    <line x1="13" y1="14" x2="17" y2="14" stroke="#002147" stroke-width="1.5"/>
    <line x1="13" y1="17" x2="17" y2="17" stroke="#002147" stroke-width="1.5"/>
    <line x1="23" y1="14" x2="27" y2="14" stroke="#002147" stroke-width="1.5"/>
    <line x1="23" y1="17" x2="27" y2="17" stroke="#002147" stroke-width="1.5"/>
  </g>
  <text x="72" y="38" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#002147" letter-spacing="1">OXFORD</text>
  <text x="72" y="55" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#002147" letter-spacing="2">UNIVERSITY PRESS</text>
</svg>
